name: Build Windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - run: npm run build-win
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: poe2-gear-coach-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
      # Tag pushes also publish the installer to a GitHub Release, so a new
      # machine can grab it from the Releases page without Node, git, or
      # cloning the repo at all.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*.exe
          generate_release_notes: true
