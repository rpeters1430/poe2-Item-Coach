name: Build Windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - run: npm run build-win
      - uses: actions/upload-artifact@v4
        with:
          name: poe2-gear-coach-windows
          path: dist/*.exe
      # Tag pushes also publish the installer to a GitHub Release, so a new
      # machine can grab it from the Releases page without Node, git, or
      # cloning the repo at all.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
